    type: Documentation
  - url: https://help.memberclicks.com/hc/en-us/articles/15442876413197-API-Resources
    type: APIReference
  description: JSON REST API for the MemberClicks MC Professional AMS, secured with
    OAuth 2.0. Base URL is organization-scoped (https://{orgId}.memberclicks.net)
    with resource paths under /api/v1, including member profiles, member types,
    and member statuses. Documented publicly in the MemberClicks help center;
    calls require an organization's API client credentials.
- aid: personifycorp:personify360-novus-api
  name: Personify360 Novus API
  tags:
  - Constituents
  - Order
  - Event
  - Certifications
  - Committees
  tags_raw:
  - Constituents
  - Orders
  - Events
  - Certifications
  - Committees
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://personifycorp.com/blog/supercharge-your-data-insights-with-novus-apis/
  baseURL: https://api.personifycorp.com
  endpointsModeled: true
  properties:
  - url: https://personifycorp.com/blog/supercharge-your-data-insights-with-novus-apis/
    type: Documentation
  description: Proprietary Novus API integration layer for the enterprise Personify360 /
    ThreeSixty AMS, documented with a Swagger (OpenAPI) interface for reporting,
    large-scale operations, and custom applications over Personify data. Logical
    resource areas follow the Personify360 modules - constituents (individuals,
    companies, donors, prospects), orders and products, events and meetings,
    certifications, and committees/subgroups. The Swagger definition and base URL
    are provisioned per customer through a Personify account manager rather than
    published publicly, so the base URL and endpoints here are modeled, not
    officially documented. Personify360 also ships an older Personify API Library.
