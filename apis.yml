name: Personify
kind: company
description: Personify (Personify Inc., part of Momentive Software as of January 2026)
  is a constituent and association management software provider for associations,
  nonprofits, and member-based organizations. Founded in 1996 and headquartered in
  Austin, Texas, Personify offers a family of products - the enterprise Personify360 /
  ThreeSixty AMS, MemberClicks (MC Professional) for mid-sized professional and trade
  associations, Wild Apricot for small associations and clubs, and A2Z Events for
  event management. Several products expose documented REST APIs secured with OAuth 2.0.
  Wild Apricot and MemberClicks publish public developer documentation, while
  Personify360's Novus APIs (Swagger-documented) are provisioned through a customer's
  account manager. API access generally requires being a paying customer of the
  respective product.
