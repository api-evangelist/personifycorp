  - Invoices
  tags_raw:
  - Membership
  - Contacts
  - Events
  - Invoices
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://gethelp.wildapricot.com/en/articles/182-using-wildapricot-s-api
  baseURL: https://api.wildapricot.org
  properties:
  - url: https://gethelp.wildapricot.com/en/articles/182-using-wildapricot-s-api
    type: Documentation
  - url: https://gethelp.wildapricot.com/en/categories/145-wild-apricot-member-api
    type: APIReference
  description: RESTful API for the Wild Apricot small-association product, secured with
    OAuth 2.0 against base https://api.wildapricot.org (versioned paths such as
    /v2.2/accounts/{accountId}/...). Split into an admin API and a member API, it
    exposes contacts, accounts, membership levels, member groups, events, event
    registrations, invoices, and payments as JSON (or XML). Access requires Wild
    Apricot account credentials.
