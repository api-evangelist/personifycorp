  - url: https://help.memberclicks.com/hc/en-us/sections/14749781143437-API
    type: Documentation
    note: MemberClicks MC Professional API section - JSON REST, OAuth 2.0.
  - url: https://help.memberclicks.com/hc/en-us/articles/15442876413197-API-Resources
    type: APIReference
    note: MC Professional API resources under /api/v1 (member-status, member-type, etc).
  - url: https://personifycorp.com/blog/supercharge-your-data-insights-with-novus-apis/
    type: Documentation
    note: Personify360 Novus APIs announcement - Swagger interface, partner/customer-provisioned.
  - url: https://personifycorp.com/
    type: Website
    note: Corporate site; contact-sales model; product family overview.
  - url: https://momentivesoftware.com/press-releases/personify-acquisition/
    type: PressRelease
    note: Momentive Software acquisition of Personify (January 2026).
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on any Personify product API. All
    documented Personify APIs (Wild Apricot, MemberClicks, Personify360 Novus)
    are request/response REST over HTTPS with OAuth 2.0. No AsyncAPI document was
    created because there is no server-push transport to model.
